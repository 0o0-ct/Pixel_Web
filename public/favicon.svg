<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17172a"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#a1a1aa"/>
      <stop offset="1" stop-color="#e5e5e5"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="31" height="31" rx="6.5" fill="none" stroke="url(#accent)" stroke-opacity=".55"/>
  <!-- Pixel P -->
  <g fill="#f4f4ff">
    <rect x="6" y="4" width="4" height="4"/>
    <rect x="10" y="4" width="4" height="4"/>
    <rect x="14" y="4" width="4" height="4"/>
    <rect x="18" y="4" width="4" height="4"/>
    <rect x="6" y="8" width="4" height="4"/>
    <rect x="18" y="8" width="4" height="4"/>
    <rect x="6" y="12" width="4" height="4"/>
    <rect x="18" y="12" width="4" height="4"/>
    <rect x="6" y="16" width="4" height="4"/>
    <rect x="10" y="16" width="4" height="4"/>
    <rect x="14" y="16" width="4" height="4"/>
    <rect x="6" y="20" width="4" height="4"/>
    <rect x="6" y="24" width="4" height="4"/>
  </g>
  <!-- Píxeles de acento -->
  <rect x="18" y="4" width="4" height="4" fill="#d4d4d8"/>
  <rect x="14" y="16" width="4" height="4" fill="#e5e5e5"/>
</svg>
